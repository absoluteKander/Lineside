name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Builds both versions, runs the unit tests, and fails if a network permission ever
      # appears in either app's manifest.
      - run: ./gradlew assembleFossDebug assemblePlayDebug testFossDebugUnitTest testPlayDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: lineside-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
